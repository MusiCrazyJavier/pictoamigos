# ============================================================================
# SECCIÓN: EMPACADO-CI — compila PictoAmigos para las tres plataformas de
# escritorio en cada push a `main` (o manualmente desde la pestaña Actions).
#
# Linux   -> .deb + .AppImage
# Windows -> .msi (WiX) + NSIS
# macOS   -> .dmg
#
# Android/iOS no salen de aquí: necesitan Android Studio/SDK y un Mac con Xcode
# (ver docs/DOCUMENTACION.md, receta14).
# ============================================================================

name: Compilar PictoAmigos

on:
  push:
    branches: [main]
  workflow_dispatch:

# Necesario para que tauri-action pueda crear el release (draft) y subir los
# instaladores. Sin esto, GitHub da "Resource not accessible by integration".
permissions:
  contents: write

jobs:
  escritorio:
    strategy:
      # max-parallel:1 — los tres trabajos suben artefactos al MISMO release;
      # en paralelo se pisaban entre ellos y GitHub devolvía error al borrar/subir.
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - platform: ubuntu-latest
            args: ""
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Rust estable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Dependencias de Linux (webkit2gtk + plugins de audio)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev build-essential \
            curl wget file libssl-dev libxdo-dev patchelf
          # Plugins de GStreamer: sin ellos el AppImage no incluye el
          # decodificador MP3 ni autoaudiosink y la app no reproduce audio
          # (bug: "GStreamer element appsink not found" + bloqueo).
          sudo apt-get install -y gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-ugly \
            gstreamer1.0-plugins-bad gstreamer1.0-libav

      - name: Configurar Node (para preparar-dist.mjs)
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Instalar Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      - name: Compilar e empaquetar
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v-app-v0.1.0
          releaseName: "PictoAmigos v0.1.0 (alpha)"
          releaseBody: |
            **ESTADO: ALPHA** — versión de prueba, aún inestable.

            App de pictogramas con voz para niños con TEA (pictogramas ARASAAC,
            licencia CC BY-NC-SA; código GPL-3.0-or-later).

            **Versionado:** mientras esté en alpha la versión es0.x; la1.0.0 será
            el primer release maduro y estable.

            Versión0.1.0: micrófono restaurado (lógica que funcionaba) y aviso
            claro en la app de escritorio.

            Conocido en alpha:
            - El micrófono funciona en el NAVEGADOR/PWA; en la app de escritorio
              (WebKitGTK) no todavía (ver README).
            - La voz se genera con Piper TTS (es_MX-claude-high).
            Licencia: GPL-3.0-or-later (código) · CC BY-NC-SA (pictogramas ARASAAC).
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}

      # Copia local de los instaladores por si el paso del release falla:
      # así siempre queda algo descargable desde la ejecución de la CI.
      - name: Guardar instaladores como artefactos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instaladores-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.tar.gz
          if-no-files-found: warn
          retention-days: 14
