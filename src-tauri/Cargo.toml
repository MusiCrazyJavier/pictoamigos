[package]
name = "pictoamigos"
version = "1.0.0"
edition = "2021"
description = "PictoAmigos — app de pictogramas con voz para niños con TEA"
license = "GPL-3.0-or-later"
authors = ["Francisco Javier Fuentes Rodriguez"]
repository = ""

[lib]
name = "pictoamigos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
opt-level = "s"
